name: Publish Steam description comparer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install catalogue check dependency
        run: python3 -m pip install -r tools/requirements.txt
      - name: Check catalogue and sampling
        run: |
          python3 tools/validate_catalogue.py
          python3 -m unittest discover -s tests -p test_catalogue.py -v
          node --test tests/test_static_catalogue.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
